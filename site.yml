runtime:
  cache_dir: ./.cache/antora

site:
  title: "RHACS: Reporting, Compliance, and Air-Gapped Scanning"
  url: https://juanlu-redhat.github.io/air-gapped-acs-workshop
  start_page: air-gapped-acs-workshop::index.adoc

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: documentation

asciidoc:
  attributes:
    release-version: master
    page-pagination: true
  extensions:
    - ./lib/tab-block.js
    - ./lib/remote-include-processor.js

ui:
  bundle:
    url: https://github.com/redhat-developer-demos/rhd-tutorial-ui/releases/download/v0.1.10/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./supplemental-ui
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

output:
  dir: ./gh-pages

# workshop-policy.yaml
# Purpose: ACS custom policy that flags deployments with critical fixable CVEs
# Import this policy into ACS using the API or the UI (Platform Configuration > Policy Management > Import)
{
  "policies": [
    {
      "name": "Workshop - Important Fixable CVEs",
      "description": "Flags deployments that contain important-severity or higher CVEs with an available fix. Uses Red Hat severity (not NVD) so it reflects actual risk on RHEL-based images.",
      "rationale": "Important and Critical CVEs with available fixes are the highest-priority remediation targets. On Red Hat images, ACS uses Red Hat VEX severity, which is often lower than the raw NVD score.",
      "remediation": "Update the image to a version that includes the fix. Check the Fixed In Version column in the ACS vulnerability view or the Red Hat CVE page for the patched version.",
      "categories": [
        "Vulnerability Management"
      ],
      "lifecycleStages": [
        "DEPLOY"
      ],
      "severity": "CRITICAL_SEVERITY",
      "enforcementActions": [],
      "policySections": [
        {
          "sectionName": "Important fixable CVEs",
          "policyGroups": [
            {
              "fieldName": "Fixed By",
              "booleanOperator": "OR",
              "negate": false,
              "values": [
                {
                  "value": ".*"
                }
              ]
            },
            {
              "fieldName": "Severity",
              "booleanOperator": "OR",
              "negate": false,
              "values": [
                {
                  "value": "IMPORTANT"
                }
              ]
            }
          ]
        }
      ],
      "disabled": false
    }
  ]
}

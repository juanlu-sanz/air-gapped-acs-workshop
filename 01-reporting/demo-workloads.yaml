# demo-workloads.yaml
# Purpose: Deploy sample workloads so vulnerability reports contain data
apiVersion: v1
kind: Namespace
metadata:
  name: demo-workloads
  labels:
    app.kubernetes.io/part-of: acs-workshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo-workloads
  labels:
    app: nginx
    app.kubernetes.io/part-of: acs-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-122
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30

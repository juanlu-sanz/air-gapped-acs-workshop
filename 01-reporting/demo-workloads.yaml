# demo-workloads.yaml
# Purpose: Deploy sample workloads so vulnerability reports contain data
apiVersion: v1
kind: Namespace
metadata:
  name: demo-workloads
  labels:
    app.kubernetes.io/part-of: acs-workshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo-workloads
  labels:
    app: nginx
    app.kubernetes.io/part-of: acs-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

# secured-cluster.yaml
# Purpose: Deploy ACS SecuredCluster on the secured cluster with Scanner-slim enabled
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: acs-workshop
spec:
  clusterName: secured
  centralEndpoint: ${ACS_CENTRAL_ENDPOINT}:443
  sensor:
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
      limits:
        cpu: "1"
        memory: 1Gi
  admissionControl:
    listenOnCreates: true
    listenOnUpdates: true
    listenOnEvents: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  perNode:
    collector:
      collection: EBPF
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    taintToleration: TolerateTaints
  scanner:
    analyzer:
      scaling:
        autoScaling: Enabled
        maxReplicas: 3
        minReplicas: 1
        replicas: 1
    scannerComponent: AutoSense

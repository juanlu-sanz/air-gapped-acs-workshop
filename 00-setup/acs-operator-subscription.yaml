# acs-operator-subscription.yaml
# Purpose: Subscribe to the RHACS Operator from OperatorHub
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  labels:
    app.kubernetes.io/part-of: acs-workshop
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  labels:
    app.kubernetes.io/part-of: acs-workshop
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhacs-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace

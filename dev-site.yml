runtime:
  cache_dir: ./.cache/antora

site:
  title: "RHACS: Reporting, Compliance, and Air-Gapped Scanning (Dev Mode)"
  url: http://localhost:3000
  start_page: air-gapped-acs-workshop::index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_path: documentation
asciidoc:
  attributes:
    title: "RHACS: Reporting, Compliance, and Air-Gapped Scanning (Dev Mode)"
  extensions:
    - ./lib/remote-include-processor.js
    - ./lib/tab-block.js
ui:
  bundle:
    url: https://github.com/redhat-developer-demos/rhd-tutorial-ui/releases/download/v0.1.10/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./gh-pages
